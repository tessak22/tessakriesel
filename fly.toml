app = "tessakriesel"
primary_region = "dfw"

[build]
  image = "ghost:6-alpine"

[env]
  url = "https://tessakriesel.com"
  database__client = "sqlite3"
  database__connection__filename = "content/data/ghost.db"
  database__useNullAsDefault = "true"
  database__debug = "false"
  NODE_ENV = "production"
  mail__transport = "Direct"

[mounts]
  source = "ghost_data"
  destination = "/var/lib/ghost/content"

[[services]]
  internal_port = 2368
  protocol = "tcp"
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    handlers = ["http"]
    port = 80
    force_https = true

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

  [[services.tcp_checks]]
    grace_period = "30s"
    interval = "15s"
    restart_limit = 0
    timeout = "2s"

[vm]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
